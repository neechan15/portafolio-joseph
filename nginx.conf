# ----------------------------------------------------------------------
# Configuración de Nginx para servir el portafolio (SPA React + Vite).
# Pensada para producción: gzip, headers de seguridad, cache agresivo
# para assets con hash y SPA fallback hacia /index.html.
# ----------------------------------------------------------------------

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Raíz del build de Vite, copiada desde la etapa "builder".
    root   /usr/share/nginx/html;
    index  index.html;

    # Tamaño máximo de cuerpo (subida de imágenes pequeñas, formularios).
    client_max_body_size 8m;

    # ---------- Compresión gzip ----------
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---------- Headers de seguridad ----------
    # Truco: definimos los headers vía map → variable, así podemos repetirlos
    # en cada location sin que `add_header` de un bloque interno los borre
    # (en Nginx, declarar add_header en un location resetea la herencia).
    # Cache para assets con hash en el nombre.
    # Vite genera ficheros tipo "index-Bf8x2.js" — son inmutables, así que
    # un Cache-Control de un año es seguro.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA fallback + index.html sin cache ----------
    # React Router maneja rutas como /cv, /404, etc. Si Nginx no encuentra
    # el archivo, devolvemos index.html para que el router decida.
    # Aquí repetimos los headers de seguridad porque `add_header` en un
    # location no hereda los del bloque server cuando declara los propios.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---------- Endpoint de healthcheck barato ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- Páginas de error ----------
    error_page 500 502 503 504  /index.html;
}
